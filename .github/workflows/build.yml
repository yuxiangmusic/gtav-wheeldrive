name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  LLVM_MINGW_VERSION: "20260922"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -sSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: WheelDrive
          path: |
            build/WheelDrive.asi
            WheelDrive.ini

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/WheelDrive.asi WheelDrive.ini \
            --title "WheelDrive $GITHUB_REF_NAME" --generate-notes
