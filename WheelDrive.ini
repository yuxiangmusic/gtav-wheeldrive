; WheelDrive config. Press F9 in game for a live readout of raw axes/buttons, F10 to reload this file.
; Defaults are calibrated on a Logitech G29 against real-car steering, acceleration and braking data.

[Wheel]
; Substring of the DirectInput device name
DeviceName=G29
; Axis names: X Y Z RX RY RZ S0 S1
SteerAxis=X
ThrottleAxis=Y
BrakeAxis=RZ
; Pedals usually read max when released, hence Invert=1
SteerInvert=0
ThrottleInvert=1
BrakeInvert=1
; Rotation range set in the wheel software (e.g. G HUB), and the lock-to-lock degrees that map to the
; car's full steering angle. 1200 with a ~40 deg GTA steering lock gives a typical real sedan's 15:1 ratio.
WheelRangeDeg=900
SteerLockDeg=1200
PedalDeadzone=0.03
; 1 = set the car's wheel angle directly and linearly from the wheel (no deadzone, no game smoothing)
; 0 = feed steering as stick input instead (game deadzone/smoothing; AntiDeadzone/Gamma apply)
SteerMode=1
; Calibration: GTA turns ~4.3x harder than a real sedan for the same angle (measured). Mode 1 output is
; multiplied by this.
SteerGain=0.23
; Extra speed-dependent factor (speed_kmh:factor): GTA over-rotates at low speed vs a real car (measured)
SteerSpeedGainCurve=0:0.6,14:0.6,18:0.66,25:0.78,35:0.91,45:1
; Response curve: 1 = linear, >1 = gentler near center (full lock still at full rotation), <1 = sharper
SteerGamma=1.0
; Speed (m/s) at which max steering is halved. 0 = off (real cars don't do this)
SteerSpeedRef=0
; Mode 0 only: GTA ignores small stick inputs; any wheel movement is pushed past that by this amount (0-0.5)
SteerAntiDeadzone=0.2

[Buttons]
; DirectInput button indices (0-based), -1 = unbound. Use the F9 overlay to find numbers.
Handbrake=0
Headlight=1
LookBehind=2
ExitVehicle=3
Horn=23
Camera=9
; Select reverse: gas pedal drives backwards, brake pedal brakes and holds. Comma-separated list.
Reverse=15
; Back to forward (cancels reverse). Comma-separated list.
Forward=14

[Pedals]
; 1 = map pedals to real-car acceleration/braking (calibrated from measured GTA response), 0 = raw passthrough
PedalMode=1
; Real-car targets in m/s^2: full-throttle acceleration (at low speed) and full-brake deceleration
MaxAccel=4.5
BrakeMaxDecel=9.0
; Kickdown: toward the floor the pedal blends to 100% of the car's own power (keeps each car's top speed).
; Higher = later/sharper kickdown. 1 = linear blend over the whole pedal.
KickdownExp=4
; Curves are speed_kmh:value pairs, linearly interpolated.
; Real sedan: available acceleration as a fraction of MaxAccel, and lift-off coasting decel (m/s^2, incl. drag)
RealAccelCurve=0:1,30:0.96,50:0.8,80:0.58,100:0.47,130:0.33,160:0.2
RealCoastCurve=0:0.3,30:0.4,60:0.55,90:0.75,120:1.0,160:1.4
; Measured GTA response (Buffalo + Taxi). Don't change unless recalibrating.
GameThrottleZero=0.271
GameThrottleSlope=11.76
GameThrottleFade=0:1.23,15:1.23,20:1.39,32:1.3,36:0.78,45:0.68,55:0.62,65:0.67,78:0.47,85:0.29,100:0.27,115:0.24,130:0.18,160:0.12
GameHold=0.26
GameHoldDecelCurve=0:0,50:0.1,80:0.3,110:0.5,130:0.8
GameEngineBrakeCurve=0:3.2,20:3.2,30:3.28,43:3.37,57:3.54,72:3.67,86:3.89,120:4.4
; Brake control = offset + decel / slope (measured: decel = 39.37*ctl - 6.21)
GameBrakeOffset=0.1577
GameBrakeSlope=39.37
; Closed-loop gain for coasting/light braking (per second); 0 = feedforward only
CoastKi=1.0

[FFB]
Enable=1
; Overall gain 0-100
Gain=80
; Centering spring coefficient (0-10000): base + per m/s, capped at SpringMax
SpringBase=0
SpringPerMps=80
SpringMax=2000
Damper=400
; Cap on spring/damper force in percent of the wheel's maximum, however far or fast you turn
MaxForce=20
